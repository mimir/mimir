repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-added-large-files
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v21.1.2
    hooks:
      - id: clang-format
        files: \.(c|cc|cpp|cxx|h|hh|hpp|hxx)$
  - repo: local
    hooks:
      - id: mim-include-style
        name: mim include style
        description: An artifact uses "..." for its own headers and <...> for everything it links against.
        entry: scripts/check_includes.py
        language: script
        files: ^(src|include|extra|test|py/bindings)/.*\.(c|cc|cpp|cxx|h|hh|hpp|hxx)$
