name: playground

on:
  push:
  pull_request:
    branches: [master]

concurrency:
  # Deploying runs share one group so they queue instead of racing on mimir.github.io; every other
  # run gets its own group via run_id and is therefore never cancelled nor queued.
  # Sharing `doxygen.yml`'s group would let its deploys evict these: only one run per group queues.
  # `env` is unavailable here, so the DEPLOY condition below is spelled out again.
  group: ${{github.workflow}}-${{(github.event_name == 'push' && github.ref == 'refs/heads/master') && 'deploy' || github.run_id}}
  cancel-in-progress: false

env:
  DEPLOY: ${{github.event_name == 'push' && github.ref == 'refs/heads/master'}}

jobs:
  build:
    name: Build the WASM playground
    runs-on: ubuntu-latest

    steps:
      - name: Clone recursively
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.9
          actions-cache-folder: emsdk-cache

      - name: Setup ccache
        uses: Chocobo1/setup-ccache-action@v1
        with:
          update_packager_index: false
          ccache_options: max_size=2G
          override_cache_key: ${{runner.os}}-ccache-wasm

      # A cross build cannot run the `mim` it just built, but bootstrapping a plugin needs one;
      # only the CLI itself is required, so skip the plugins, tests, and Python bindings here.
      - name: Build the native bootstrap compiler
        run: |
          CC=gcc-14 CXX=g++-14                \
          cmake -B build-native               \
                -G Ninja                      \
                -DCMAKE_BUILD_TYPE=Release    \
                -DBUILD_TESTING=OFF           \
                -DMIM_BUILD_PYTHON=OFF        \
                -DMIM_VERIFY_PLUGINS=OFF
          cmake --build build-native --target mim

      - name: Configure
        run: |
          emcmake cmake -B build-wasm                                              \
                -G Ninja                                                           \
                -DCMAKE_BUILD_TYPE=Release                                         \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache                                 \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache                               \
                -DBUILD_SHARED_LIBS=OFF                                            \
                -DBUILD_TESTING=OFF                                                \
                -DMIM_BUILD_PYTHON=OFF                                             \
                -DMIM_VERIFY_PLUGINS=OFF                                           \
                -DMIM_NATIVE_MIM=${{github.workspace}}/build-native/bin/mim

      - name: Build
        run: cmake --build build-wasm --target mim_playground

      # A wasm-only regression (see `Def::ops_ptr`) fails here instead of silently shipping;
      # `cmake --build build-wasm --target mim_playground_smoke` runs the very same check locally.
      - name: Smoke test
        run: node web/smoke.js build-wasm/bin lit/docs/count.mim

      - name: Upload the playground
        uses: actions/upload-artifact@v4
        with:
          name: playground
          path: build-wasm/playground/
          if-no-files-found: error

      - name: Checkout docs repository
        if: env.DEPLOY == 'true'
        uses: actions/checkout@v4
        with:
          repository: mimir/mimir.github.io
          ref: master
          path: site
          ssh-key: ${{secrets.ACTIONS_DEPLOY_KEY}}

      # `docs/deploy.py` keeps `playground/` out of the docs deploy's sweep; see its FOREIGN_DIRS.
      - name: Deploy
        if: env.DEPLOY == 'true'
        run: python3 docs/deploy.py --build-dir build-wasm/playground --subdir playground
