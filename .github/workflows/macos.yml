name: macos

on:
  push:
  pull_request:
    branches: [master]

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: ${{github.ref != 'refs/heads/master'}}

jobs:
  build-and-test:
    name: Build and test ${{matrix.build-type}} mode
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]

    steps:
      - name: Clone recursively
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install lit psutil

      - name: Install LLVM and add to PATH
        run: |
          brew install llvm
          LLVM_PREFIX=$(brew --prefix llvm)
          echo "LLVM_PREFIX=${LLVM_PREFIX}" >> $GITHUB_ENV
          echo "${LLVM_PREFIX}/bin" >> $GITHUB_PATH

      # setup-ccache-action hooks the compiler by prepending its symlink dir (cc, c++, clang, ...)
      # to PATH. The Configure step below passes *absolute* paths into ${LLVM_PREFIX}/bin, which
      # sidesteps those symlinks entirely -- ccache saw 2 calls and a 40 KB cache, i.e. every build
      # here, abseil included, was compiled from scratch. CMAKE_{C,CXX}_COMPILER_LAUNCHER hooks it
      # regardless of how the compiler is spelled.
      - name: Setup ccache
        uses: Chocobo1/setup-ccache-action@v1
        with:
          ccache_options: max_size=2G
          override_cache_key: mac-latest-ccache-${{matrix.build-type}}

      - name: Configure
        run: |
          CC="${LLVM_PREFIX}/bin/clang" CXX="${LLVM_PREFIX}/bin/clang++" \
          cmake -B ${{github.workspace}}/build                           \
                -G Ninja                                                 \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache                        \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache                      \
                -DCMAKE_BUILD_TYPE=${{matrix.build-type}}                \
                -DBUILD_TESTING=ON                                       \
                -DMIM_BUILD_EXAMPLES=ON                                  \
                -DMIM_FILECHECK=${LLVM_PREFIX}/bin/FileCheck             \
                -DMIM_LIT_TIMEOUT=300                                    \
                -DPython3_EXECUTABLE=${{github.workspace}}/.venv/bin/python3

      - name: Build
        run: cmake --build ${{github.workspace}}/build -v

      - name: Test
        working-directory: ${{github.workspace}}/build
        run: |
          export PATH=${{github.workspace}}/bin:$PATH
          cmake --build ${{github.workspace}}/build -v --target test-all
