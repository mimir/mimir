name: doxygen

on:
  push:
  pull_request:
    branches: [master]

concurrency:
  # Key PR runs by head SHA so a new push doesn't cancel the previous commit's still-running
  # build; pushes to master/tags keep the plain workflow-ref group.
  group: ${{github.workflow}}-${{github.ref}}${{github.event.pull_request.head.sha && format('-{0}', github.event.pull_request.head.sha) || ''}}
  cancel-in-progress: ${{github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/v')}}

env:
  DOXYGEN_VERSION: 1.16.1
  DOXYGEN_DIR: ${{github.workspace}}/.cache/doxygen
  DEPLOY: ${{github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))}}

jobs:
  build-and-deploy:
    name: Build and deploy documentation
    runs-on: ubuntu-latest

    steps:
      - name: Clone recursively
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ubuntu-24.04 already ships gcc-14, cmake, and ninja; g++-14 is re-listed only so the job
      # does not silently depend on the image shipping it. gdb drives docs/generate_xdot_help.gdb
      # and graphviz renders the .dot graphs. This used to also pull ghostscript and four texlive
      # packages -- ~80 min of install time on its own -- to rasterise the formulas in core.mim and
      # math.mim; docs/Doxyfile.in renders them with MathJax now, so no LaTeX is involved.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 gdb graphviz

      - name: Restore Doxygen cache
        id: cache-doxygen
        uses: actions/cache@v4
        with:
          path: ${{env.DOXYGEN_DIR}}
          # `bin` marks the flattened (--strip-components=1) layout: the previous key cached a
          # doxygen-<version>/ subdir, and restoring that under the new path would report a hit
          # while leaving DOXYGEN_DIR/bin/doxygen missing.
          key: ${{runner.os}}-doxygen-bin-${{env.DOXYGEN_VERSION}}

      - name: Install Doxygen
        if: steps.cache-doxygen.outputs.cache-hit != 'true'
        run: |
          archive="doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          tag="Release_${DOXYGEN_VERSION//./_}"

          curl -L --fail --retry 5 --retry-all-errors --output "${RUNNER_TEMP}/${archive}" \
               "https://github.com/doxygen/doxygen/releases/download/${tag}/${archive}"
          rm -rf "${DOXYGEN_DIR}"
          mkdir -p "${DOXYGEN_DIR}"
          tar -C "${DOXYGEN_DIR}" --strip-components=1 -xf "${RUNNER_TEMP}/${archive}"

      - name: Setup ccache
        uses: Chocobo1/setup-ccache-action@v1
        with:
          update_packager_index: false
          ccache_options: max_size=2G
          override_cache_key: ${{runner.os}}-ccache-docs

      - name: Configure
        run: |
          CC=gcc-14 CXX=g++-14                                    \
          cmake -B build                                          \
                -G Ninja                                          \
                -DCMAKE_BUILD_TYPE=Debug                          \
                -DMIM_BUILD_DOCS=ON                               \
                -DDOXYGEN_EXECUTABLE=${{env.DOXYGEN_DIR}}/bin/doxygen

      - name: Build
        run: cmake --build build -v --target docs

      - name: Checkout docs repository
        if: env.DEPLOY == 'true'
        uses: actions/checkout@v4
        with:
          repository: mimir/mimir.github.io
          ref: master
          path: site
          ssh-key: ${{secrets.ACTIONS_DEPLOY_KEY}}

      - name: Deploy
        if: env.DEPLOY == 'true'
        run: python3 docs/deploy.py
