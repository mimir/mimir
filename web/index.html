<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MimIR Playground</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="playground.css">
<link rel="stylesheet" href="code.css">
<!-- Stamps `dark-mode`/`light-mode` on <html> before the first paint, so load it here rather than at the end. -->
<script src="darkmode-toggle.js"></script>
</head>
<body>
<header>
    <h1><a href="https://mimir.github.io/" title="MimIR"><img src="logo.svg" alt="MimIR"></a>MimIR Playground</h1>
    <select id="examples" title="Load an example"></select>
    <label><input type="checkbox" id="optimize" checked> optimize</label>
    <button id="run"><svg class="icon fill" viewBox="0 0 24 24" aria-hidden="true"><path class="play" d="M7 4v16l13-8z"/><rect class="stop" x="6" y="6" width="12" height="12" rx="1.5"/></svg><span>Run</span></button>
    <span class="spacer"></span>
    <span id="status">loading…</span>
    <doxygen-awesome-dark-mode-toggle id="theme" title="Toggle Light/Dark Mode"></doxygen-awesome-dark-mode-toggle>
</header>

<main>
    <div id="editor">
        <div id="editor-bar">
            <label title="vi keybindings; `:w` runs."><input type="checkbox" id="vi"> vi</label>
            <button id="share" title="Copies a link to this program to your clipboard."><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg><span>Share</span></button>
        </div>
        <textarea id="source" spellcheck="false"></textarea>
    </div>

    <div id="right">
        <div id="tabs" role="tablist">
            <button role="tab" data-pane="log"   aria-selected="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 17 6-5-6-5M12 19h8"/></svg>Log</button>
            <button role="tab" data-pane="ast"   aria-selected="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 6H8M21 12h-8M21 18h-8M3 6v4a2 2 0 0 0 2 2h3M3 10v6a2 2 0 0 0 2 2h3"/></svg>AST</button>
            <button role="tab" data-pane="mim"   aria-selected="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h3l10 16M12.5 11.5 6 20"/></svg>Mim</button>
            <button role="tab" data-pane="graph" aria-selected="true"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8.5 6h7M7.2 8.2l3.6 7.6M16.8 8.2l-3.6 7.6"/></svg>Graph</button>
            <button role="tab" data-pane="ll"    aria-selected="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></svg>LLVM</button>
        </div>
        <div id="panes">
            <div class="pane" id="pane-log"  hidden><pre></pre></div>
            <div class="pane" id="pane-ast"  hidden><pre></pre></div>
            <div class="pane" id="pane-mim"  hidden>
                <div class="opts" id="mim-opts">
                    <label title="Uses ASCII alternatives instead of UTF-8 throughout the output."><input type="checkbox" id="ascii"> ASCII</label>
                    <label title="Ascribes the type of each `let`-bound name; it is inferable from the right-hand side and hence elided by default."><input type="checkbox" data-mim="typed-let"> typed lets</label>
                    <label title="Dumps each mutable as its own flat block without scheduling; the result does not read back but works for broken programs."><input type="checkbox" data-mim="local"> local blocks</label>
                </div>
                <pre></pre>
            </div>
            <div class="pane" id="pane-graph">
                <div class="opts" id="dot-opts">
                    <label title="Always shows a lambda's filter - even if it is the default one (`ff` for continuations, `tt` for direct-style functions)."><input type="checkbox" data-dot="default-filter"> default filter</label>
                    <label title="Follows type dependencies."><input type="checkbox" data-dot="follow-types"> type edges</label>
                    <label title="Wires up literals, axioms, etc. with normal edges instead of detaching them into a separate row; useful for small graphs."><input type="checkbox" data-dot="inline-consts"> inline consts</label>
                    <label title="Renders otherwise-transparent detached edges - back-edges from a Var to its binder, shared literals/axioms, and type edges - in a subtle gray."><input type="checkbox" data-dot="show-hidden"> hidden edges</label>
                    <label title="Drops the tooltip a node shows on hover - two fifths of the DOT."><input type="checkbox" data-dot="no-tooltip"> no tooltips</label>
                    <label title="Labels a node `Node name_gid` instead of the boxed two-line label. Another third off the DOT, at the cost of the ports an edge docks at."><input type="checkbox" data-dot="lean-labels"> lean labels</label>
                </div>
                <div id="graph" tabindex="0"></div>
                <div id="graph-nav">
                    <button id="popout" title="Show this graph in a window of its own.">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
                    </button>
                    <button data-zoom="out" title="Zoom out (-)">&#8722;</button>
                    <button data-zoom="in"  title="Zoom in (+)">+</button>
                    <button data-zoom="fit" title="Fit to pane (0, or double-click)">Fit</button>
                </div>
            </div>
            <div class="pane" id="pane-ll"   hidden><pre></pre></div>
        </div>
    </div>
</main>

<!-- Defines the lexers the docs colour their snippets with; Code.init() is not used here. -->
<script src="code.js"></script>
<script src="mim-code.js"></script>
<script src="llvm-code.js"></script>
<script type="module" src="playground.js"></script>
</body>
</html>
